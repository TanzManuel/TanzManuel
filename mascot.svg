<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260" role="img" aria-label="Orange block mascot" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e98a68"/><stop offset="1" stop-color="#cf6340"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4a98c"/><stop offset="1" stop-color="#ee9575"/></linearGradient>
<linearGradient id="arm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e58461"/><stop offset="1" stop-color="#c85c3a"/></linearGradient>
</defs>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.sway{transform-box:fill-box;transform-origin:center bottom;animation:sway 5.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.shadow{transform-box:fill-box;transform-origin:center;animation:sh 2.6s ease-in-out infinite}
@keyframes sh{0%,100%{transform:scale(1);opacity:.32}50%{transform:scale(.82);opacity:.18}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.armL{transform-box:fill-box;transform-origin:right center;animation:wl 2.6s ease-in-out infinite}
.armR{transform-box:fill-box;transform-origin:left center;animation:wr 2.6s ease-in-out infinite}
@keyframes wl{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes wr{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
.foot{animation:step 1.3s ease-in-out infinite}
.foot2{animation:step 1.3s ease-in-out infinite .65s}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.f{font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace;font-size:18px;font-weight:700;opacity:0;animation:fl 4s ease-in-out infinite}
@keyframes fl{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}80%{opacity:.9}100%{opacity:0;transform:translateY(-34px)}}
</style>
<ellipse class="shadow" cx="180" cy="236" rx="82" ry="9" fill="#000"/>
<text class="f" x="20" y="130" fill="#a78bfa" style="animation-delay:0s">&lt;/&gt;</text>
<text class="f" x="300" y="110" fill="#38bdf8" style="animation-delay:1.3s">{ }</text>
<text class="f" x="312" y="190" fill="#fbbf24" style="animation-delay:2.4s">;</text>
<text class="f" x="22" y="200" fill="#22d3ee" style="animation-delay:3.1s">=&gt;</text>
<g class="bob"><g class="sway">
  <!-- feet -->
  <g class="foot"><rect x="112" y="194" width="14" height="16" rx="2" fill="#a94d2c"/><rect x="236" y="194" width="14" height="16" rx="2" fill="#a94d2c"/></g>
  <g class="foot2"><rect x="136" y="194" width="14" height="16" rx="2" fill="#b9532f"/><rect x="212" y="194" width="14" height="16" rx="2" fill="#b9532f"/></g>
  <!-- arms -->
  <rect class="armL" x="62" y="118" width="40" height="22" rx="3" fill="url(#arm)"/>
  <rect class="armR" x="258" y="118" width="40" height="22" rx="3" fill="url(#arm)"/>
  <!-- body -->
  <path d="M96 78 H264 L276 92 H84 Z" fill="url(#top)"/>
  <rect x="84" y="92" width="192" height="108" rx="7" fill="url(#front)"/>
  <rect x="84" y="92" width="192" height="3" fill="#fbc3ab" opacity=".6"/>
  <!-- eyes -->
  <g class="eyes"><rect x="132" y="116" width="15" height="40" rx="2" fill="#0b0b10"/><rect x="213" y="116" width="15" height="40" rx="2" fill="#0b0b10"/></g>
</g></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
